# Runs tools/check.mjs (Prettier formatting, links, cache stamps, Learn chapter pages, fuzz test of every generator) and the Playwright tests
# (real clicks and taps on every game station, Learn chapter, and 3D step) on every push and pull request.
# GitHub Pages deploys main on its own, so a red check here means the live site may already be broken: fix it fast.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # check.mjs takes about 7 to 8 minutes, most of it the fuzz test of every station (timed 2026-10-22, with Grade 7)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/check.mjs

  # The tests run in 14 jobs side by side: the whole suite is over 3 hours of test time, and a runner does 2 at once.
  # The slow files (every Learn step, every checklist item, every game station) are split by screen and into shards of about
  # 12 minutes or less each (timed 2026-10-22, with Grade 5); "Everything else" runs every other test file, so a new one is
  # never left out.
  # When a job nears its time limit, give that file another shard.
  playwright:
    name: playwright (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Learn steps, desktop 1/4", args: "tests/learn-steps.spec.js --project=desktop --shard=1/4" }
          - { name: "Learn steps, desktop 2/4", args: "tests/learn-steps.spec.js --project=desktop --shard=2/4" }
          - { name: "Learn steps, desktop 3/4", args: "tests/learn-steps.spec.js --project=desktop --shard=3/4" }
          - { name: "Learn steps, desktop 4/4", args: "tests/learn-steps.spec.js --project=desktop --shard=4/4" }
          - { name: "Learn steps, phone 1/3", args: "tests/learn-steps.spec.js --project=phone --shard=1/3" }
          - { name: "Learn steps, phone 2/3", args: "tests/learn-steps.spec.js --project=phone --shard=2/3" }
          - { name: "Learn steps, phone 3/3", args: "tests/learn-steps.spec.js --project=phone --shard=3/3" }
          - { name: "Checklists, desktop 1/2", args: "tests/checklists.spec.js --project=desktop --shard=1/2" }
          - { name: "Checklists, desktop 2/2", args: "tests/checklists.spec.js --project=desktop --shard=2/2" }
          - { name: "Checklists, phone 1/2", args: "tests/checklists.spec.js --project=phone --shard=1/2" }
          - { name: "Checklists, phone 2/2", args: "tests/checklists.spec.js --project=phone --shard=2/2" }
          - { name: "Games, desktop", args: "tests/games.spec.js --project=desktop" }
          - { name: "Games, phone", args: "tests/games.spec.js --project=phone" }
          - { name: "Everything else", args: "'^(?!.*(learn-steps|checklists|games)\\.spec)'" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the outside files (three.js, fonts) the tests keep in tools/.cache, so they don't depend on the CDN
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: outside-files-${{ github.run_id }}
          restore-keys: outside-files-
      - run: npx playwright test ${{ matrix.args }}
        env:
          CI: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: test-results/
