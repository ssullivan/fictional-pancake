# Runs tools/check.mjs (links, cache stamps, fuzz test of every generator) on every push and pull request.
# GitHub Pages deploys main on its own, so a red check here means the live site may already be broken: fix it fast.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
